name: Build

on:
  workflow_dispatch:
    inputs:
      github_release:
        description: Upload to GitHub release
        type: boolean
        default: true
      fresh_build:
        description: Ignore build cache and build from scratch
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Moves the sources to the tips of their branches once, so that the builds
  # of both CPUs use the same commits.
  sources:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    # Cache keys and artifact names start with the target triple; the keys of
    # the build and ccache caches have the LLVM version after the CPU.
    outputs:
      target: ${{ steps.defaults.outputs.target }}
      llvm: ${{ steps.defaults.outputs.llvm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the defaults
        id: defaults
        run: |
          . scripts/defaults.env
          echo "target=${TARGET_TRIPLE}" >> "${GITHUB_OUTPUT}"
          echo "llvm=llvm${LLVM_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: |
          scripts/install-dependencies.sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Restore sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sources
          key: ${{ steps.defaults.outputs.target }}-sources-${{ github.run_id }}
          restore-keys: ${{ steps.defaults.outputs.target }}-sources-

      - name: Update sources
        run: |
          scripts/build.sh --sources-only
          . scripts/defaults.env
          cp "build/${PACKAGE_MARCH}/revisions.txt" revisions.txt

      - name: Upload revisions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.defaults.outputs.target }}-revisions
          path: revisions.txt
          if-no-files-found: error

      - name: Save sources
        id: save_sources
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sources
          key: ${{ steps.defaults.outputs.target }}-sources-${{ github.run_id }}

      - name: Delete older sources caches
        if: ${{ steps.save_sources.outcome == 'success' }}
        run: |
          gh cache list --key ${{ steps.defaults.outputs.target }}-sources- --limit 100 --json key \
            --jq '.[].key | select(. != "${{ steps.defaults.outputs.target }}-sources-${{ github.run_id }}")' \
            | xargs -r -n 1 gh cache delete

  build:
    needs: sources
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - march: x86-64-v3
            mtune: generic
          - march: znver3
            mtune: znver3
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_DIR: build/${{ matrix.march }}
      LOGS_DIR: ${{ needs.sources.outputs.target }}-logs-${{ matrix.march }}
    outputs:
      clang_version: ${{ steps.clang.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          scripts/install-dependencies.sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Record the clang version
        id: clang
        run: |
          . scripts/defaults.env
          echo "version=$("clang-${LLVM_VERSION}" -dumpversion)" >> "${GITHUB_OUTPUT}"

      - name: Restore sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sources
          key: ${{ needs.sources.outputs.target }}-sources-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Download revisions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.sources.outputs.target }}-revisions

      # The build cache key hashes the output of build-inputs.sh: when it
      # changes, no build cache matches, and the build starts from scratch with
      # ccache. The logs include it as build-inputs.txt.
      - name: Hash the build inputs
        id: build_inputs
        run: |
          scripts/build-inputs.sh | tee build-inputs.txt
          echo "hash=$(sha256sum build-inputs.txt | cut -c 1-16)" >> "${GITHUB_OUTPUT}"

      - name: Restore build
        if: ${{ !inputs.fresh_build }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.BUILD_DIR }}
            !${{ env.BUILD_DIR }}/toolchain/rustup-prefix
          key: ${{ needs.sources.outputs.target }}-build-${{ matrix.march }}-${{ needs.sources.outputs.llvm }}-${{ steps.build_inputs.outputs.hash }}-${{ github.run_id }}
          restore-keys: ${{ needs.sources.outputs.target }}-build-${{ matrix.march }}-${{ needs.sources.outputs.llvm }}-${{ steps.build_inputs.outputs.hash }}-

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ccache
          key: ${{ needs.sources.outputs.target }}-ccache-${{ matrix.march }}-${{ needs.sources.outputs.llvm }}-${{ github.run_id }}
          restore-keys: ${{ needs.sources.outputs.target }}-ccache-${{ matrix.march }}-${{ needs.sources.outputs.llvm }}-

      - name: Build
        id: build
        run: |
          ccache --dir ccache --zero-stats
          scripts/build.sh --march ${{ matrix.march }} --mtune ${{ matrix.mtune }} --revisions revisions.txt

      - name: Show the ccache statistics
        if: ${{ always() && steps.build.conclusion != 'skipped' }}
        run: ccache --dir ccache --show-stats --verbose

      - name: Package
        run: scripts/package.sh --march ${{ matrix.march }}

      - name: Upload archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.sources.outputs.target }}-release-${{ matrix.march }}
          path: release
          if-no-files-found: error
          compression-level: 0

      - name: Collect logs
        if: ${{ always() }}
        run: |
          mkdir -p "${LOGS_DIR}"
          cp -f build-inputs.txt "${LOGS_DIR}/" || true
          ccache --dir ccache --print-stats > "${LOGS_DIR}/ccache-stats.txt" || true
          find "${BUILD_DIR}" -type f \( -iname "*-*.log" -o -wholename "*/ffbuild/config.log" \) \
            -exec cp -f -t "${LOGS_DIR}" {} + || true

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.LOGS_DIR }}
          path: ${{ env.LOGS_DIR }}
          if-no-files-found: ignore

      - name: Save build
        id: save_build
        if: ${{ always() && steps.build.conclusion != 'skipped' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.BUILD_DIR }}
            !${{ env.BUILD_DIR }}/toolchain/rustup-prefix
          key: ${{ needs.sources.outputs.target }}-build-${{ matrix.march }}-${{ needs.sources.outputs.llvm }}-${{ steps.build_inputs.outputs.hash }}-${{ github.run_id }}

      - name: Save ccache
        id: save_ccache
        if: ${{ always() && steps.build.conclusion != 'skipped' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ccache
          key: ${{ needs.sources.outputs.target }}-ccache-${{ matrix.march }}-${{ needs.sources.outputs.llvm }}-${{ github.run_id }}

      # Older caches are deleted only after the new one is saved.
      - name: Delete older build caches
        if: ${{ always() && steps.save_build.outcome == 'success' }}
        run: |
          gh cache list --key ${{ needs.sources.outputs.target }}-build-${{ matrix.march }}- --limit 100 --json key \
            --jq '.[].key | select(. != "${{ needs.sources.outputs.target }}-build-${{ matrix.march }}-${{ needs.sources.outputs.llvm }}-${{ steps.build_inputs.outputs.hash }}-${{ github.run_id }}")' \
            | xargs -r -n 1 gh cache delete

      - name: Delete older ccache caches
        if: ${{ always() && steps.save_ccache.outcome == 'success' }}
        run: |
          gh cache list --key ${{ needs.sources.outputs.target }}-ccache-${{ matrix.march }}- --limit 100 --json key \
            --jq '.[].key | select(. != "${{ needs.sources.outputs.target }}-ccache-${{ matrix.march }}-${{ needs.sources.outputs.llvm }}-${{ github.run_id }}")' \
            | xargs -r -n 1 gh cache delete

  release:
    needs: [sources, build]
    if: ${{ inputs.github_release }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ needs.sources.outputs.target }}-release-*
          path: release
          merge-multiple: true

      - name: Download revisions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.sources.outputs.target }}-revisions

      - name: Create the release
        run: |
          revision() { awk -v source="$1" '$1 == source { print substr($2, 1, 9) }' revisions.txt; }
          tag="$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short=7 HEAD)"
          notes="**LLVM/Clang**: ${{ needs.build.outputs.clang_version }}
          **mpv**: [$(revision mpv)](https://github.com/mpv-player/mpv/commit/$(revision mpv))
          **FFmpeg**: [$(revision ffmpeg)](https://github.com/FFmpeg/FFmpeg/commit/$(revision ffmpeg))
          **libplacebo**: [$(revision libplacebo)](https://github.com/haasn/libplacebo/commit/$(revision libplacebo))
          **Workflow**: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          gh release create "${tag}" release/*.7z --target "${GITHUB_SHA}" --title "$(date -u '+%Y-%m-%d %H:%M')" --notes "${notes}"

      - name: Keep the latest 30 releases
        run: |
          gh release list --limit 1000 --json tagName --jq '.[].tagName' \
            | sort -r -V \
            | tail -n +31 \
            | xargs -r -n 1 gh release delete --cleanup-tag --yes
